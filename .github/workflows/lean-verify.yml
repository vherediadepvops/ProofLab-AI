name: Verify Mathematical Discovery with Lean 4

# Local validation is the default. Run CI only when explicitly requested.
on:
  workflow_dispatch:

jobs:
  lean-proof-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4 using elan
        shell: bash
        run: |
          curl --fail --silent --show-error https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prove known reference theorems
        run: lean formal/KnownBenchmarks.lean
      - name: Confirm invalid strategy is rejected
        run: |
          if lean formal/InvalidProof.lean; then
            echo "ERROR: invalid proof was unexpectedly accepted"
            exit 1
          else
            echo "Negative verification passed (invalid proof rejected)."
          fi
      - name: Set up .NET 10 for research-workflow integration
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify five-stage scientific method and real Lean evidence
        shell: bash
        run: |
          dotnet build src/ProofLab.Api/ProofLab.Api.csproj -c Release
          dotnet run --no-build --no-launch-profile -c Release \
            --project src/ProofLab.Api/ProofLab.Api.csproj \
            --urls http://127.0.0.1:5392 > /tmp/prooflab-math-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for n in {1..30}; do
            if curl -fsS http://127.0.0.1:5392/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5392/api/health >/dev/null
          pwsh -NoProfile -File tests/smoke-math-evidence.ps1 \
            -BaseUrl http://127.0.0.1:5392
