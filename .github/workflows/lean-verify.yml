name: Verify Mathematical Discovery with Lean 4

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lean-proof-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4 using elan
        shell: bash
        run: |
          curl --fail --silent --show-error https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prove known reference theorems
        run: lean formal/KnownBenchmarks.lean
      - name: Confirm invalid strategy is rejected
        run: |
          if lean formal/InvalidProof.lean; then
            echo "ERROR: invalid proof was unexpectedly accepted"
            exit 1
          else
            echo "Negative verification passed (invalid proof rejected)."
          fi
